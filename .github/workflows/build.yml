name: APK bauen

# Push auf main und Pull Requests: Tests, Prüfung „kein Internet“, Testversion
# (de.uekala.kehraus.test) als Artefakt und eine Probe der Release-Signatur mit Wegwerf-Schlüsseln.
# Release (Tag mobile-vX.Y.Z oder „Run workflow“ mit „Release anlegen“ auf main): zusätzlich signierte
# Release-APK und GitHub-Release (für Obtainium).
on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/bilder/**'
      - '.github/workflows/app-bilder.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release mobile-v<appVersion> aus main anlegen (Version aus gradle.properties)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # versionCode steigt mit jedem Lauf dieses Workflows (letztes Release vor dem Umbau: 59).
      VERSION_CODE: ${{ github.run_number }}
      RELEASE: ${{ (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')) }}
      # Alter Sideload-Schlüssel (bis 0.1, öffentlich geworden) – Vorgänger in der Lineage.
      ALT_CERT_SHA256: F1B1CE12796611F03C74B0095F650C12754106DE101DAED351408533917E495D
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Version prüfen
        run: |
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::appVersion in gradle.properties fehlt oder ist keine Version X.Y.Z"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "mobile-v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu appVersion $VERSION"
            exit 1
          fi
          if [[ "$RELEASE" == "true" && "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "mobile-v$VERSION" > /dev/null; then
            echo "::error::Release mobile-v$VERSION gibt es schon – für ein neues Release appVersion erhöhen und CHANGELOG ergänzen"
            exit 1
          fi
          bash tools/changelog-abschnitt.sh CHANGELOG.md "$VERSION" > /dev/null
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: APKs bauen
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Prüfen, dass die App kein Internet anfordert
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          for apk in app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/debug/app-debug.apk; do
            "$AAPT2" dump permissions "$apk" | tee rechte.txt
            if grep -q "android.permission.INTERNET" rechte.txt; then
              echo "::error::$apk fordert Internetzugang an."
              exit 1
            fi
          done

      - name: Signatur-Probe mit Wegwerf-Schlüsseln
        run: bash tools/signatur-probe.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Testversion benennen
        run: cp app/build/outputs/apk/debug/app-debug.apk "kehraus-test-${VERSION_NAME}-${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kehraus-test-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: kehraus-test-*.apk

      - name: Release-APK signieren
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          ANDROID_OLD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_OLD_KEYSTORE_PASSWORD }}
          ANDROID_OLD_KEY_ALIAS: ${{ secrets.ANDROID_OLD_KEY_ALIAS }}
        run: bash tools/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "kehraus-${VERSION_NAME}.apk"

      - name: Release-Signatur prüfen
        if: env.RELEASE == 'true'
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash tools/verify-apk-signature.sh "kehraus-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RELEASE == 'true'
        with:
          name: release-apk
          path: kehraus-${{ env.VERSION_NAME }}.apk

  release:
    needs: apk
    if: (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')"
          TAG="mobile-v$VERSION"
          bash tools/changelog-abschnitt.sh CHANGELOG.md "$VERSION" > notes.md
          APK="kehraus-$VERSION.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Von Hand angelegtes Release: APK anhängen, Titel und Text aus dem CHANGELOG
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Kehraus Mobile $VERSION" --notes-file notes.md
          else
            # Bei „Run workflow“ entsteht der Tag hier, auf genau dem gebauten Commit
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Kehraus Mobile $VERSION" --notes-file notes.md
          fi
