name: APK bauen

# Push auf main und Pull Requests: Tests, Prüfung „kein Internet“, Testversion
# (de.uekala.kehraus.test) als Artefakt und eine Probe der Release-Signatur mit Wegwerf-Schlüsseln.
# Tag mobile-vX.Y.Z: zusätzlich signierte Release-APK und GitHub-Release (für Obtainium).
on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/bilder/**'
      - '.github/workflows/app-bilder.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # versionCode steigt mit jedem Lauf dieses Workflows (letztes Release vor dem Umbau: 59).
      VERSION_CODE: ${{ github.run_number }}
      # Alter Sideload-Schlüssel (bis 0.1, öffentlich geworden) – Vorgänger in der Lineage.
      ALT_CERT_SHA256: F1B1CE12796611F03C74B0095F650C12754106DE101DAED351408533917E495D
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version prüfen
        run: |
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::appVersion in gradle.properties fehlt oder ist keine Version X.Y.Z"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "mobile-v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu appVersion $VERSION"
            exit 1
          fi
          bash tools/changelog-abschnitt.sh CHANGELOG.md "$VERSION" > /dev/null
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: APKs bauen
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Prüfen, dass die App kein Internet anfordert
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          for apk in app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/debug/app-debug.apk; do
            "$AAPT2" dump permissions "$apk" | tee rechte.txt
            if grep -q "android.permission.INTERNET" rechte.txt; then
              echo "::error::$apk fordert Internetzugang an."
              exit 1
            fi
          done

      - name: Signatur-Probe mit Wegwerf-Schlüsseln
        run: bash tools/signatur-probe.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Testversion benennen
        run: cp app/build/outputs/apk/debug/app-debug.apk "kehraus-test-${VERSION_NAME}-${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: kehraus-test-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: kehraus-test-*.apk

      - name: Release-APK signieren
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          ANDROID_OLD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_OLD_KEYSTORE_PASSWORD }}
          ANDROID_OLD_KEY_ALIAS: ${{ secrets.ANDROID_OLD_KEY_ALIAS }}
        run: bash tools/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "kehraus-${VERSION_NAME}.apk"

      - name: Release-Signatur prüfen
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash tools/verify-apk-signature.sh "kehraus-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        with:
          name: release-apk
          path: kehraus-${{ env.VERSION_NAME }}.apk

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-apk

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          bash tools/changelog-abschnitt.sh CHANGELOG.md "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" "kehraus-$VERSION.apk" \
            --title "Kehraus Mobile $VERSION" --notes-file notes.md --verify-tag
