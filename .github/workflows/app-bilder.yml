name: App-Bilder

# Startet die echte App in einem Android-Emulator mit erfundenen Beispieldateien, tippt sie
# durch und legt die Bildschirmfotos als Artefakt an den Lauf. Daraus stammen die Bilder in
# der README. Läuft von Hand oder wenn sich die Aufnahme selbst ändert.

concurrency:
  group: app-bilder-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/bilder/**"
      - ".github/workflows/app-bilder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilder:
    name: Bildschirmfotos der App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Emulator aufnehmen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 tools/bilder/aufnehmen.py

      - name: Bilder anhängen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kehraus-app-bilder
          path: build/app-bilder
          if-no-files-found: warn
          retention-days: 14
